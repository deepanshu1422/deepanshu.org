<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deepanshu Udhwani — Free AI Resources</title>
<meta name="description" content="Reels mein bataye gaye saare free AI tools, Claude skills aur prompts — ek jagah.">
<meta property="og:title" content="Free AI Resources — Deepanshu Udhwani">
<meta property="og:description" content="Reels mein bataye gaye saare free AI tools, Claude skills aur prompts — ek jagah.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fbf8f2; --ink:#26231f; --muted:#6b645b; --card:#fff; --line:#e8e1d5; --accent:#d97757; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191714; --ink:#f3eee6; --muted:#a69d91; --card:#23201c; --line:#35302a; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; line-height:1.5; }
  main { max-width:880px; margin:0 auto; padding:56px 16px 72px; }
  header { margin-bottom:36px; }
  .eyebrow { font-family:"JetBrains Mono",monospace; font-size:13px; letter-spacing:.08em; color:var(--accent); text-transform:uppercase; }
  h1 { font-size:clamp(30px,6vw,46px); font-weight:800; line-height:1.1; margin:10px 0 12px; }
  header p { color:var(--muted); max-width:560px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr)); gap:16px; }
  .card { display:flex; flex-direction:column; gap:10px; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; transition:transform .15s, border-color .15s; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .tag { font-size:12px; color:var(--muted); }
  .kw { font-family:"JetBrains Mono",monospace; font-size:11px; background:var(--ink); color:var(--bg); padding:4px 8px; border-radius:5px; }
  h2 { font-size:20px; }
  .card p { color:var(--muted); font-size:15px; flex:1; }
  .go { font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--accent); }
  footer { margin-top:44px; color:var(--muted); font-size:14px; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">deepanshu.org</div>
    <h1>Free AI resources</h1>
    <p>Reels mein jo bhi tools, Claude skills aur prompts bataye — sab yahan. Free, open source, bina signup ke.</p>
  </header>
  <section class="grid">
{{CARDS}}
  </section>
  <footer>Naye resources har hafte aate hain — <a href="https://www.instagram.com/deepanshu.udhwani/">@deepanshu.udhwani</a> pe follow karo.</footer>
</main>
</body>
</html>
